# docker-compose.yaml
services:
  db:
    image: postgres:13-alpine
    container_name: audio-saas-db
    restart: 'no'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    container_name: audio-saas-redis
    restart: 'no'
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  engagement-redis:
    image: redis:7-alpine
    container_name: audio-saas-engagement-redis
    restart: 'no'
    ports:
      - '6380:6379'

  rate-limit-redis:
    image: redis:7-alpine
    container_name: audio-saas-ratelimit-redis
    restart: 'no'
    ports:
      - '6381:6379'

  caching-redis:
    image: redis:7-alpine
    container_name: audio-saas-caching-redis
    restart: 'no'
    ports:
      - '6382:6379'

  engagement-bg-svc:
    container_name: engagement-bg-svc
    image: audiosass-engagement-bg-svc
    build: ./packages/engagement-bg-svc
    restart: 'no'
    network_mode: host # due to main backend not being dockerized yet
    env_file:
      - ./packages/engagement-bg-svc/.env
    environment:
      # Datadog APM configuration
      - DD_TRACE_ENABLED=true
      - DD_SERVICE=engagement-bg-svc
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-1.0.0}
      - DD_AGENT_HOST=localhost # Localhost due to network_mode: host
      - DD_TRACE_AGENT_PORT=8126

  audio-transcoding-svc:
    container_name: audio-transcoding-svc
    image: audiosass-transcoding-svc
    depends_on:
      redis:
        condition: service_healthy
    build:
      context: ./audio-processing-container
      dockerfile: Dockerfile
    restart: 'no'
    network_mode: 'host' # due to main backend not being dockerized yet
    env_file:
      - ./audio-processing-container/.env
    environment:
      - AWS_PROFILE=default
      - AWS_SDK_LOAD_CONFIG=1
      # Datadog APM configuration
      - DD_TRACE_ENABLED=true
      - DD_SERVICE=audio-transcoding-svc
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-1.0.0}
      - DD_AGENT_HOST=localhost # Localhost due to network_mode: host
      - DD_TRACE_AGENT_PORT=8126
    volumes:
      - ${HOME}/.aws:/home/node/.aws:ro
    tmpfs:
      - /tmp

  datadog-agent:
    image: registry.datadoghq.com/agent:7
    container_name: dd-agent
    restart: 'no'
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_TRACE_ENABLED=true
    ports:
      - '8126:8126' # APM Traces (Node dd-trace hits this port)
      - '8125:8125/udp' # DogStatsD (Metrics)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
