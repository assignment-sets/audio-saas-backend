# docker-compose.yaml
services:
  db:
    image: postgres:13-alpine
    container_name: audio-saas-db
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    container_name: audio-saas-redis
    restart: "no"
    ports:
      - '6379:6379'