# docker-compose.yaml
services:
  db:
    image: postgres:13-alpine
    container_name: audio-saas-db
    restart: 'no'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    container_name: audio-saas-redis
    restart: 'no'
    ports:
      - '6379:6379'

  engagement-redis:
    image: redis:7-alpine
    container_name: audio-saas-engagement-redis
    restart: 'no'
    ports:
      - '6380:6379'

  engagement-bg-svc:
    container_name: engagement-bg-svc
    image: audiosass-engagement-bg-svc
    build: ./packages/engagement-bg-svc
    restart: 'no'
    network_mode: host
    env_file:
      - ./packages/engagement-bg-svc/.env
